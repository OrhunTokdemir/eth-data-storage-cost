[workspace]
resolver = "2"
members = ["crates/proof-store", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
alloy = { version = "2.6", features = ["full", "node-bindings", "kzg", "json-rpc"] }
tokio = { version = "1.54", features = ["full"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
clap = { version = "4.6", features = ["derive", "env"] }
dialoguer = "0.12"
comfy-table = "8"
zstd = "0.14"
dotenvy = "0.15"
rand = "0.10"
proof-store = { path = "crates/proof-store" }
